<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תעלומת רצח</title>
<style>
:root{--bg:#faf7f2;--fg:#1d1a16;--card:#fff;--mut:#7a7167;--ac:#8b2d2d;--ln:#e4ddd2;--ok:#1f8a4c;--no:#c23030;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#17140f;--fg:#efe9df;--card:#221e18;--mut:#a39a8d;--ac:#d86a6a;--ln:#38322a;color-scheme:dark}}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,"Segoe UI",Arial,sans-serif}
#app{max-width:640px;margin:auto;height:100%;display:flex;flex-direction:column;padding:10px;box-sizing:border-box;gap:8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px}
h1{margin:6px 0;font-size:24px;color:var(--ac)}h3{margin:0 0 6px}
input,button{font:inherit;border-radius:10px;border:1px solid var(--ln);padding:10px;background:var(--card);color:var(--fg)}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px}.row>input{flex:1;min-width:0}
.hide{display:none!important}.mut{color:var(--mut);font-size:14px}.err{color:var(--no)}
#bar{display:flex;justify-content:space-between;align-items:center;font-weight:600}
#tm{font-variant-numeric:tabular-nums;color:var(--ac);font-size:20px}
#tabs{display:flex;gap:6px}#tabs button{flex:1}#tabs .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.panel{flex:1;min-height:0;overflow:auto}
#pc{display:flex;flex-direction:column;gap:8px}#msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}
.m{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:6px 10px}.m b{color:var(--ac)}.m.me{border-color:var(--ac)}
.story p{margin:0 0 10px}.kill{border-color:var(--no);border-width:2px}
.pr{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--ln)}.pr .n{flex:1}.pr.clr .n{text-decoration:line-through;color:var(--mut)}
.big{font-size:34px;text-align:center;font-weight:700;padding:18px;border-radius:12px;color:#fff;margin:8px 0}
.ok{background:var(--ok)}.no{background:var(--no)}
#ov{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:16px;z-index:5;box-sizing:border-box}
.cnt{font-size:96px;text-align:center;color:var(--ac);font-weight:700;margin-top:20vh}
textarea{width:100%;min-height:170px;box-sizing:border-box;font:inherit;border-radius:10px;border:1px solid var(--ln);padding:10px;background:var(--card);color:var(--fg);resize:vertical}
#mapbox svg text{font:600 13px system-ui,Arial,sans-serif;text-anchor:middle}
</style></head><body><div id="app">
<div id="v-in" class="card"><h1>🕵️ תעלומת רצח</h1>
<p class="mut">מישהו בחדר הוא הרוצח. קראו את הסיפור האישי שלכם, חקרו בצ׳אט, והצביעו.</p>
<div class="row" style="margin-bottom:8px"><input id="nm" placeholder="השם שלך" maxlength="16"></div>
<div class="row"><input id="cd" placeholder="קוד משחק" inputmode="numeric" maxlength="4"><button class="p" id="join">הצטרף</button></div>
<div style="margin-top:8px"><button id="new">פתח משחק חדש</button></div><p id="er" class="err"></p></div>

<div id="v-wait" class="card hide"><h3>חדר המתנה</h3><p>קוד המשחק: <b id="wc" style="font-size:28px"></b></p>
<div id="wl"></div><p class="mut" id="wh"></p><button class="p hide" id="start">התחל משחק (נועל כניסה)</button></div>

<div id="v-g" class="hide" style="display:flex;flex-direction:column;gap:8px;flex:1;min-height:0">
<div id="bar" class="card"><span id="ph"></span><span id="tm"></span></div>
<div id="tabs"><button data-t="c" class="on">צ׳אט</button><button data-t="s">התיק שלי</button><button data-t="m">מפה</button><button data-t="b">חשודים</button></div>
<div id="pc" class="panel"><div id="msgs"></div><div class="row"><input id="ci" placeholder="כתוב הודעה…" maxlength="300"><button class="p" id="cs">שלח</button></div></div>
<div id="ps" class="panel story hide"></div><div id="pm" class="panel hide"><div class="card"><div id="mapbox"></div></div><div class="card" style="margin-top:8px"><h3>הפתקים שלי</h3><p class="mut">אזור פרטי שרק אתה רואה. רשום כאן רמזים, חשדות וסתירות.</p><textarea id="notes" placeholder="הפתקים שלך…"></textarea></div></div><div id="pb" class="panel hide"></div></div>
<div id="ov" class="hide"></div></div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let ID=L("mm-id");if(!ID){ID=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now());L("mm-id",ID)}
const S={code:"",s:null,ph:{p:"lobby"},tab:"c",pend:null,es:null};
const API=(p,b)=>fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...b,id:ID})}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.e||"שגיאה");return j});
function err(m){$("#er").textContent=m||""}
async function enter(create){const name=$("#nm").value.trim();if(!name)return err("הכנס שם");L("mm-name",name);err();
 try{const r=await API(create?"/api/new":"/api/join",{name,code:$("#cd").value.trim()});connect(r.code)}catch(e){err(e.message)}}
function connect(code){S.code=code;L("mm-code",code);$("#notes").value=L("mm-note-"+code+ID)||"";if(S.es)S.es.close();
 const es=S.es=new EventSource(`/api/events?code=${code}&id=${encodeURIComponent(ID)}`);
 es.onmessage=e=>{const m=JSON.parse(e.data);S.ph=m.phase;if(m.tick){tick();return}S.s=m;render()}}
function render(){const m=S.s;if(!m)return;$("#v-in").classList.add("hide");
 if(m.status==="lobby"){$("#v-g").classList.add("hide");$("#v-wait").classList.remove("hide");$("#wc").textContent=m.code;
  $("#wl").innerHTML=m.players.map(p=>`<div class="pr"><span class="n">${esc(p.name)}${p.id===ID?" (אתה)":""}</span></div>`).join("");
  const host=m.host===ID;$("#start").classList.toggle("hide",!host);$("#start").disabled=m.players.length<3;
  $("#wh").textContent=host?(m.players.length<3?"צריך לפחות 3 שחקנים כדי להתחיל.":"כשכולם כאן, התחל. אחרי ההתחלה הכניסה נעולה."):"ממתינים שהמארח יתחיל…";return}
 $("#v-wait").classList.add("hide");$("#v-g").classList.remove("hide");
 $("#ps").innerHTML=m.story||"";drawMap();drawBoard();drawChat();tick()}
function drawChat(){const el=$("#msgs");el.innerHTML=S.s.chat.map(c=>`<div class="m ${c.uid===ID?"me":""}"><b>${esc(c.name)}:</b> ${esc(c.text)}</div>`).join("");el.scrollTop=el.scrollHeight}
function drawMap(){const d=S.s.map;if(!d)return;
 let h='<svg viewBox="0 0 306 306" style="width:100%;max-width:420px;display:block;margin:auto" role="img" aria-label="מפת הזירה">';
 d.cells.forEach((r,i)=>{const x=(i%3)*103,y=Math.floor(i/3)*103,sc=i===d.scene,me=i===d.me,w=r.split(" "),ln=w.length>2?[w[0]+" "+w[1],w.slice(2).join(" ")]:w;
  h+=`<rect x="${x}" y="${y}" width="100" height="100" rx="10" style="fill:${sc?"var(--no)":"var(--card)"};fill-opacity:${sc?.18:1};stroke:${sc?"var(--no)":me?"var(--ac)":"var(--ln)"};stroke-width:${sc||me?3:1.5}"/>`;
  if(sc)h+=`<text x="${x+50}" y="${y+20}" style="fill:var(--no)">🔍 זירת הרצח</text>`;
  ln.forEach((t,k)=>h+=`<text x="${x+50}" y="${y+50+k*16-(ln.length-1)*8}" style="fill:var(--fg)">${esc(t)}</text>`);
  if(me)h+=`<circle cx="${x+50}" cy="${y+80}" r="12" style="fill:var(--ac)"/><text x="${x+50}" y="${y+84}" style="fill:#fff;font-size:11px">אתה</text>`});
 $("#mapbox").innerHTML=h+`</svg><p style="margin:10px 0 0"><b>הרצח התרחש ${esc(d.sceneFull)}.</b><br>בזמן הרצח (21:45) אתה היית ${esc(d.mineFull)}.</p><p class="mut" style="margin:4px 0 0">רק אתה רואה איפה היית. מיקומם של האחרים נשאר חידה.</p>`}
const marks=()=>{try{return JSON.parse(L("mm-sus-"+S.code)||"{}")}catch(e){return{}}};
function setMark(i){const m=marks();m[i]=!m[i];L("mm-sus-"+S.code,JSON.stringify(m));drawBoard()}
function drawBoard(){const m=S.s;if(!m||!m.roster)return;const mk=marks(),mine=m.myVote,can=!mine&&S.ph.p==="play";
 $("#pb").innerHTML=`<div class="card"><p class="mut">כולם חשודים כברירת מחדל. הסר חשודים לעצמך, ואז הצבע. אחרי ההצבעה היא ננעלת.</p>`+
 m.roster.filter(p=>p.id!==ID).map(p=>`<div class="pr ${mk[p.id]?"clr":""}"><span class="n">${esc(p.name)}</span><button data-m="${p.id}">${mk[p.id]?"החזר לחשוד":"הסר מהחשודים"}</button>`+
 (mine?(mine===p.id?"<b>✔ הצבעת</b>":""):`<button class="${S.pend===p.id?"p":""}" data-v="${p.id}" ${can?"":"disabled"}>${S.pend===p.id?"לחץ שוב לאישור":"הצבע"}</button>`)+`</div>`).join("")+
 (mine?`<p class="mut">הצבעת. ממתינים לשאר השחקנים או לסיום הזמן (${m.voted.length}/${m.roster.length} הצביעו).</p>`:"")+"</div>"}
function tick(){const m=S.s;if(!m||m.status!=="playing"||!m.roster)return;const f=S.ph,ov=$("#ov");
 const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
 if(f.p==="play"){$("#ph").textContent="החקירה נמשכת";$("#tm").textContent=fmt(f.left);ov.classList.add("hide");return}
 $("#tm").textContent="00:00";ov.classList.remove("hide");
 if(f.p==="count"){ov.innerHTML=`<p class="mut" style="text-align:center">ההצבעה נסגרה. התוצאה בעוד…</p><div class="cnt">${f.n}</div>`;return}
 const r=m.result;if(!r){ov.innerHTML='<p class="mut" style="text-align:center;margin-top:30vh">טוען תוצאות…</p>';return}
 ov.innerHTML=(r.none?`<div class="big no">אף אחד לא הצביע</div>`:`<p class="mut" style="text-align:center">הנאשם לפי רוב הקולות:</p><div class="big ${r.ok?"ok":"no"}">${r.top.map(esc).join(" / ")}</div><p style="text-align:center">${r.ok?"✔ צדקתם! הרוצח נתפס.":"✘ טעיתם. הרוצח ברח."}</p>`)+
 `<div class="card"><h3>מי הצביע על מי</h3>${r.votes.map(v=>`<div class="pr"><span class="n">${esc(v.name)}</span>${v.target?"← "+esc(v.target):'<span class="mut">לא הצביע</span>'}</div>`).join("")}</div>`+
 (r.ok?"":`<div class="card kill"><h3>הרוצח האמיתי: ${esc(r.killer)}</h3>${r.killerStory}</div>`)}
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.t){S.tab=b.dataset.t;document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  ["c","s","m","b"].forEach(t=>$("#p"+t).classList.toggle("hide",t!==S.tab))}
 if(b.dataset.m)setMark(b.dataset.m);
 if(b.dataset.v){if(S.pend!==b.dataset.v){S.pend=b.dataset.v;drawBoard();return}
  const t=S.pend;S.pend=null;try{await API("/api/vote",{code:S.code,target:t})}catch(x){}}});
$("#join").onclick=()=>enter(false);$("#new").onclick=()=>enter(true);
$("#cs").onclick=async()=>{const i=$("#ci"),t=i.value.trim();if(!t)return;i.value="";try{await API("/api/chat",{code:S.code,text:t})}catch(e){}};
$("#ci").onkeydown=e=>{if(e.key==="Enter")$("#cs").click()};
$("#start").onclick=()=>API("/api/start",{code:S.code}).catch(e=>err(e.message));
$("#notes").oninput=()=>{clearTimeout(window._nt);window._nt=setTimeout(()=>L("mm-note-"+S.code+ID,$("#notes").value),400)};
$("#nm").value=L("mm-name")||"";
(async()=>{const c=L("mm-code"),n=L("mm-name");if(c&&n){try{const r=await API("/api/join",{name:n,code:c});connect(r.code)}catch(e){L("mm-code",null)}}})();
</script></body></html>
